[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-fa-platform"
version = "0.1.0"
description = "Tax-data processing and calculation platform for Indian Schedule FA reporting of foreign broker assets"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    # Used directly by the raw workbook reader to parse untrusted sheet XML.
    "defusedxml>=0.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
worker = ["redis>=5.0", "arq>=0.26"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
fa = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "golden: golden-fixture tests requiring a real broker workbook fixture",
    "integration: end-to-end pipeline tests",
    "property: property-based ledger invariant tests",
]
filterwarnings = [
    # Our own deprecations are bugs; a third party's are not ours to fix, and
    # letting one fail the suite means an upstream release can break a build
    # that has nothing wrong with it. Ignored narrowly, by message.
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "DTZ", "RET", "SIM", "PTH"]
ignore = [
    "S101",
    "B008",
    # The DTZ family requires timezone-aware datetimes. This platform works in
    # naive calendar dates on purpose: a trade date, a Schedule FA reporting
    # period boundary, an SBI publication date and a spreadsheet date serial
    # are all wall-clock values with no timezone in the source. Attaching UTC
    # to them would invent information the source never supplied, and could
    # shift a transaction across a period boundary.
    "DTZ001",
    "DTZ005",
    "DTZ007",
    "DTZ901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S"]
# Alembic writes these. Reformatting generated code to satisfy a line-length
# rule makes the next autogenerated revision show up as a diff against the
# formatting rather than against the schema, which is the thing being reviewed.
"backend/app/db/migrations/versions/*.py" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "(^|/)(\\.venv|frontend|build)/"

[tool.coverage.run]
source = ["backend/app"]
